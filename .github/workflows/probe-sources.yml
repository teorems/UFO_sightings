name: Check notable-case links (temporary)
on:
  push:
    branches: [claude/exciting-ramanujan-rkox4i]
    paths: [.github/workflows/probe-sources.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          while read -r u; do
            r=$(curl -sS -L -m 30 -A "UFO_sightings dashboard (https://github.com/teorems/UFO_sightings)" -o /dev/null -w '%{http_code} %{url_effective}' "$u" || echo "fail")
            echo "$r <- $u"; sleep 1
          done < .github/linkcheck.txt
