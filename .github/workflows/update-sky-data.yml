name: Update sky data

# Satellite orbits (CelesTrak), upcoming launches (Launch Library 2) and
# UAP/UFO headlines (Google News search) for the "Sky tonight" page. Orbits
# stay usable for days, so once a day is plenty.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download satellite orbits, launches and headlines
        run: python3 scripts/update_sky_data.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/sky
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update sky data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
